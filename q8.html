<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: aqua;
        color: black;
    }

    body.dark {
        background-color: blue;
        color: cadetblue;
    }
</style>
<body>
    <span id="icon" onclick="toggle()">😀</span>
    <script>
        function toggle() {
            document.body.classList.toggle("dark");
        }
    </script>
    
</body>
</html>
